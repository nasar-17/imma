<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lagu Favorit | Immaaa Cantiii</title>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="assets/css/navbar.css">
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Dancing+Script:wght@700&family=Parisienne&display=swap" rel="stylesheet">
  <style>
    .logo {
      font-family: 'Playfair Display', cursive; /* Pilihan font: 'Parisienne' atau 'Dancing Script' */
      font-size: 20px;
      font-weight: bold;
      background: linear-gradient(45deg, #ff6b8b, #ff8e53);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
      letter-spacing: 2px;
      margin: 0;
      padding: 0.5rem 1rem;
      display: inline-block;
      border-bottom: 2px solid rgba(255,182,193,0.5);
      transform: rotate(-2deg);
      animation: float 3s ease-in-out infinite;
    }

    /* Animasi mengambang */
    @keyframes float {
      0% { transform: translateY(0px) rotate(-2deg); }
      50% { transform: translateY(-5px) rotate(-2deg); }
      100% { transform: translateY(0px) rotate(-2deg); }
    }

    /* Efek hover */
    .logo:hover {
      animation: none;
      transform: scale(1.05) rotate(-2deg);
      text-shadow: 3px 3px 6px rgba(0,0,0,0.3);
      animation: float 3s ease-in-out infinite;
    }
    .music-section {
      padding: 2rem;
      text-align: center;
      max-width: 1200px;
      margin: 0 auto;
    }
    .section-title {
      font-size: 2.5rem;
      margin-bottom: 2rem;
      color: var(--white);
      text-shadow: 0 2px 4px rgba(0,0,0,0.2);
    }
    .custom-player {
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 2rem;
      margin: 2rem auto;
      max-width: 600px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.1);
    }
    .player-controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      margin-top: 1.5rem;
    }
    #play-btn {
      background: var(--pink-soft);
      color: white;
      border: none;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      font-size: 1.2rem;
      cursor: pointer;
      transition: all 0.3s;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #play-btn:hover {
      background: var(--pink-dark);
      transform: scale(1.1);
    }
    #progress {
      flex-grow: 1;
      height: 6px;
      accent-color: var(--pink-soft);
      cursor: pointer;
    }
    #current-time {
      color: var(--white);
      font-size: 0.9rem;
      min-width: 50px;
    }
    .song-info {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }
    .song-cover {
      width: 80px;
      height: 80px;
      border-radius: 10px;
      object-fit: cover;
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    }
    .song-details {
      text-align: left;
    }
    .song-title {
      font-size: 1.2rem;
      margin: 0;
      color: var(--white);
    }
    .song-artist {
      font-size: 0.9rem;
      margin: 0.3rem 0 0;
      color: rgba(255,255,255,0.8);
    }
    .playlist {
      margin-top: 3rem;
    }
    .playlist-item {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 0.8rem 1.5rem;
      border-radius: 10px;
      margin-bottom: 1rem;
      background: rgba(255,255,255,0.1);
      transition: all 0.3s;
      cursor: pointer;
    }
    .playlist-item:hover {
      background: rgba(255,255,255,0.2);
      transform: translateX(5px);
    }
    .playlist-item.active {
      background: var(--pink-soft);
    }
    .playlist-cover {
      width: 50px;
      height: 50px;
      border-radius: 8px;
    }
    @media (max-width: 768px) {
      .player-controls {
        flex-direction: column;
        gap: 1rem;
      }
      #progress {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar">
    <div class="logo">ANDI IKMA<br> NANDA ANGGRIA</div>
    <div class="nav-links">
      <a href="../index.html">Home</a>
      <a href="album.html">Album</a>
      <a href="kata-kata.html">Kata-kata</a>
      <a href="lagu.html" class="active">Lagu</a>
      <a href="https://imma-ai-production.up.railway.app/">AI</a>
    </div>
        <!-- Hamburger Icon -->
  <div class="hamburger">
    <i class="fas fa-bars"></i>
  </div>
  </nav>
  
  <!-- Overlay -->
  <div class="overlay"></div>

  <!-- Music Section -->
  <section class="music-section">
    <h2 class="section-title">Lagu Immaaa 🎧</h2>

    <!-- Custom Player -->
    <div class="custom-player">
      <div class="song-info">
        <img src="assets/media/to the bone.png" alt="Song Cover" class="song-cover" id="cover">
        <div class="song-details">
          <h3 class="song-title" id="song-title">To The Bone</h3>
          <p class="song-artist" id="song-artist">Pamungkas</p>
        </div>
      </div>

      <audio id="audio" src="assets/media/musik.mp3"></audio>
      <div class="player-controls">
        <button id="play-btn"><i class="fas fa-play"></i></button>
        <input type="range" id="progress" value="0">
        <span id="current-time">0:00</span>
      </div>
    </div>

    <!-- Playlist -->
    <div class="playlist">
      <h3><i class="fas fa-list"></i> Daftar Putar</h3>

      <div class="playlist-item active" data-title="To The Bone" data-artist="Pamungkas" data-src="assets/media/musik.mp3" data-cover="assets/media/to the bone.png">
        <img src="assets/media/to the bone.png" alt="Cover 1" class="playlist-cover">
        <div>
          <h4>To The Bone</h4>
          <p>Pamungkas</p>
        </div>
      </div>

      <div class="playlist-item" data-title="End of Beginning" data-artist="Djo" data-src="../assets/media/Djo - End of Beginning (Official Lyric Video).mp3" data-cover="assets/media/Djo.png">
        <img src="assets/media/Djo.png" alt="Cover 2" class="playlist-cover">
        <div>
          <h4>End of Beginning</h4>
          <p>Djo</p>
        </div>
      </div>
      
      <div class="playlist-item" data-title="Perfect" data-artist="Ed Sheeran" data-src="assets/media/Ed Sheeran - Perfect - LatinHype.mp3" data-cover="assets/media/perfect.png">
        <img src="assets/media/perfect.png" alt="Cover 2" class="playlist-cover">
        <div>
          <h4>Perfect</h4>
          <p>Ed Sheeran</p>
        </div>
      </div>
    </div>
    
    <div class="playlist-item" data-title="Happier" data-artist="Olivia Rodrigo" data-src="assets/media/Olivia Rodrigo - Happier - LatinHype.mp3" data-cover="assets/media/happier.png">
      <img src="assets/media/happier.png" alt="Cover 2" class="playlist-cover">
      <div>
        <h4>Happier</h4>
        <p>Olivia Rodrigo</p>
      </div>
    </div>

    <div class="playlist-item" data-title="Mine" data-artist="Petra Sihombing" data-src="assets/media/Petra Sihombing ft Ben Sihombing - Mine [Official Music Video] - HITS Records.mp3" data-cover="assets/media/mine.png">
      <img src="assets/media/mine.png" alt="Cover 2" class="playlist-cover">
      <div>
        <h4>Mine</h4>
        <p>Petra Sihombing</p>
      </div>
    </div>
</section>

  <script>
    // Music Player Functionality
    const audio = document.getElementById('audio');
    const playBtn = document.getElementById('play-btn');
    const progress = document.getElementById('progress');
    const currentTime = document.getElementById('current-time');
    const playlistItems = document.querySelectorAll('.playlist-item');
    const cover = document.getElementById('cover');
    const songTitle = document.getElementById('song-title');
    const songArtist = document.getElementById('song-artist');

    // Play/Pause
    playBtn.addEventListener('click', () => {
      if (audio.paused) {
        audio.play();
        playBtn.innerHTML = '<i class="fas fa-pause"></i>';
      } else {
        audio.pause();
        playBtn.innerHTML = '<i class="fas fa-play"></i>';
      }
    });

    // Update progress
    audio.addEventListener('timeupdate', () => {
      const percent = (audio.currentTime / audio.duration) * 100;
      progress.value = percent || 0;

      const minutes = Math.floor(audio.currentTime / 60);
      const seconds = Math.floor(audio.currentTime % 60);
      currentTime.textContent = `${minutes}:${seconds < 10 ? '0' + seconds : seconds}`;
    });

    // Seek
    progress.addEventListener('input', () => {
      const seekTime = (progress.value / 100) * audio.duration;
      audio.currentTime = seekTime;
    });

    // Song ended
    audio.addEventListener('ended', () => {
      playBtn.innerHTML = '<i class="fas fa-play"></i>';
      progress.value = 0;
      currentTime.textContent = '0:00';
    });

    // Playlist functionality
    playlistItems.forEach(item => {
      item.addEventListener('click', () => {
        playlistItems.forEach(i => i.classList.remove('active'));
        item.classList.add('active');

        const newTitle = item.getAttribute('data-title');
        const newArtist = item.getAttribute('data-artist');
        const newSrc = item.getAttribute('data-src');
        const newCover = item.getAttribute('data-cover');

        songTitle.textContent = newTitle;
        songArtist.textContent = newArtist;
        audio.src = newSrc;
        cover.src = newCover;

        audio.play();
        playBtn.innerHTML = '<i class="fas fa-pause"></i>';
      });
    });
    document.addEventListener('DOMContentLoaded', () => {
  const hamburger = document.querySelector('.hamburger');
  const navLinks = document.querySelector('.nav-links');

  hamburger.addEventListener('click', () => {
    navLinks.classList.toggle('active');
  });
});

 // Close navbar when clicking on overlay or menu item
 overlay.addEventListener('click', () => {
        navLinks.classList.remove('active');
        overlay.classList.remove('active');
      });

      const menuItems = document.querySelectorAll('.nav-links a');
      menuItems.forEach(item => {
        item.addEventListener('click', () => {
          navLinks.classList.remove('active');
          overlay.classList.remove('active');
        });
      });

  </script>
</body>
</html>
