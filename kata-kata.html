    async function typeQuote() {
      let quoteData;
      
      try {
        const response = await fetch('https://api.quotable.io/random?tags=love|happiness');
        quoteData = await response.json();
      } catch (error) {
        console.log("Menggunakan kutipan lokal...");
        quoteData = fallbackQuotes[Math.floor(Math.random() * fallbackQuotes.length)];
      }
  
      new Typed('#quote-text', {
        strings: [`"${quoteData.content}"`],
        typeSpeed: 30,
        showCursor: false,
        onComplete: () => {
          document.getElementById('quote-author').textContent = `— ${quoteData.author}`;
          document.getElementById('quote-author').style.opacity = '1';
        }
      });
    }
    document.addEventListener('DOMContentLoaded', () => {
      const hamburger = document.querySelector('.hamburger');
      const navLinks = document.querySelector('.nav-links');
    
      hamburger.addEventListener('click', () => {
        navLinks.classList.toggle('active');
      });
    });
  
    document.addEventListener('DOMContentLoaded', typeQuote);
    
    document.getElementById('new-quote').addEventListener('click', () => {
      document.getElementById('quote-text').textContent = '';
      document.getElementById('quote-author').style.opacity = '0';
      typeQuote();
    });
       // Close navbar when clicking on overlay or menu item
       overlay.addEventListener('click', () => {
        navLinks.classList.remove('active');
        overlay.classList.remove('active');
      });

      menuItems.forEach(item => {
        item.addEventListener('click', () => {
          navLinks.classList.remove('active');
          overlay.classList.remove('active');
        });
